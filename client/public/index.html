<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="description" content="🏆 Torneo de Clanes 2026 - Tabla de posiciones, calendario de jornadas y resultados en tiempo real" />
    <meta name="keywords" content="torneo, clanes, gaming, competencia, tabla de posiciones, VEGETTA, WILLYREX, ALEXBY, ROIER" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="🏆 Torneo de Clanes 2026" />
    <meta property="og:description" content="Sigue la tabla de posiciones y resultados del Torneo de Clanes 2026" />
    <meta property="og:image" content="%PUBLIC_URL%/torneo-preview.jpg" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="🏆 Torneo de Clanes 2026" />
    <meta property="twitter:description" content="Sigue la tabla de posiciones y resultados del Torneo de Clanes 2026" />
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>" />
    <title>🏆 Torneo de Clanes 2026</title>
    
    <style>
      /* Loader mientras carga la aplicación */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      
      #loading-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      
      .loader-container {
        text-align: center;
        animation: fadeIn 0.5s ease-in;
      }
      
      .loader-trophy {
        font-size: 80px;
        animation: bounce 1.5s infinite;
        display: block;
        margin-bottom: 20px;
      }
      
      .loader-title {
        color: #ffffff;
        font-size: 2rem;
        font-weight: 700;
        margin: 20px 0 10px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      
      .loader-subtitle {
        color: #aaa;
        font-size: 1rem;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      }
      
      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top: 4px solid #8a2be2;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 30px auto 0;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
      }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
        <h1>Torneo de Clanes 2026</h1>
        <p>Necesitas habilitar JavaScript para ejecutar esta aplicación.</p>
      </div>
    </noscript>
    
    <!-- Pantalla de carga -->
    <div id="loading-screen">
      <div class="loader-container">
        <span class="loader-trophy">🏆</span>
        <h1 class="loader-title">Torneo de Clanes 2026</h1>
        <p class="loader-subtitle">Cargando tabla de posiciones...</p>
        <div class="spinner"></div>
      </div>
    </div>
    
    <div id="root"></div>
    
    <script>
      // Ocultar el loader cuando React termine de cargar
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loader = document.getElementById('loading-screen');
          if (loader) {
            loader.classList.add('fade-out');
            setTimeout(function() {
              loader.style.display = 'none';
            }, 500);
          }
        }, 500);
      });
    </script>
  </body>
</html>
